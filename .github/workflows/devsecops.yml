name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Verify requirements file
        run: |
          pwd
          ls -la
          find . -type f -name "requirements*.txt"

      - name: Scan dependencies with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest \
            fs --scanners vuln /project/requirements.txt
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Test Dockerfile
        run: |
          echo "ecrire ici le scrypt de contrôle du Dockerfile"
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"